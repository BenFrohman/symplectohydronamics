server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }
    location ^~ /library/ { return 404; }
    location ^~ /archive/ { return 404; }
    location = /papers/triple-regularization.html { return 301 /papers/library.html; }
    location = /papers/fusion-plasma.html { return 301 /papers/library.html; }
    location ~* \.(css|js|jpg|jpeg|png|svg|pdf|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
