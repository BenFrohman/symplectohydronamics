name: Lean certificate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain pinned by library/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        run: lake build
      - name: Axiom audit
        run: |
          set -o pipefail
          lake env lean AxiomAudit.lean 2>&1 | tee axioms.txt
      - name: Check axioms are standard only
        run: |
          OK='depends on axioms: \[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]$|does not depend on any axioms$'
          n=$(grep -c "^#print axioms" AxiomAudit.lean); m=$(grep -E "^'" axioms.txt | grep -cE "$OK" || true)
          echo "audited $n declarations, $m with standard axioms only"
          [ "$n" -eq "$m" ] || { cat axioms.txt; exit 1; }
      - name: No sorry / no axiom declarations
        working-directory: .
        run: python3 scripts/check_no_sorry.py
